services:
  - type: web
    name: ai-typist-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: OCR_CONFIDENCE_THRESHOLD
        value: "0.75"
      - key: OCR_PRIMARY_LANG
        value: "hin+eng"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000,https://ai-typist-liard.vercel.app,https://ai-typist.vercel.app"
      - key: ENABLE_EASYOCR_FALLBACK
        value: "false"
      - key: PORT
        value: "8000"
